<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1065" viewBox="0 0 1800 1065" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.5}
      .clk{fill:#fdf2e3;stroke:#c77d1a;stroke-width:1.5}
      .rf{fill:#e8f1fb;stroke:#2a6bb3;stroke-width:1.5}
      .pl{fill:#eaf6ea;stroke:#2e8b3a;stroke-width:1.5}
      .sp{fill:#e6f4f4;stroke:#13807f;stroke-width:1.5}
      .ps{fill:#f3ecfa;stroke:#7a4bb0;stroke-width:1.5}
      .ln{stroke:#333;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .bus{stroke:#2e8b3a;stroke-width:3.5;fill:none;marker-end:url(#a)}
      .sbus{stroke:#13807f;stroke-width:3.5;fill:none;marker-end:url(#a)}
      .ctl{stroke:#7a4bb0;stroke-width:1.4;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .ck{stroke:#c77d1a;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .t{font-weight:bold;font-size:14px}
      .s{font-size:11.5px;fill:#333}
      .h{font-weight:bold;font-size:18px}
    </style>
  </defs>
  <rect x="0" y="0" width="1800" height="1065" fill="#ffffff"/>

  <text x="20" y="30" class="h">lunaZCU111 : 8 x 3932.16 MSPS transient trigger &amp; capture + integrating spectrometer (XCZU28DR, ZCU111)</text>

  <!-- region frames -->
  <rect x="15" y="50" width="265" height="995" rx="8" fill="none" stroke="#c77d1a" stroke-dasharray="6 4"/>
  <text x="25" y="70" class="t" fill="#c77d1a">ZCU111 clocking</text>
  <rect x="295" y="50" width="1150" height="745" rx="8" fill="none" stroke="#2e8b3a" stroke-dasharray="6 4"/>
  <text x="305" y="70" class="t" fill="#2e8b3a">RFSoC PL (VHDL + IP)</text>
  <rect x="295" y="830" width="1490" height="215" rx="8" fill="none" stroke="#7a4bb0" stroke-dasharray="6 4"/>
  <text x="305" y="850" class="t" fill="#7a4bb0">RFSoC PS (Linux, PetaLinux 2023.2)</text>

  <!-- clocking -->
  <rect x="30" y="90" width="235" height="130" class="clk" rx="6"/>
  <text x="40" y="110" class="t">LMK04208 (U90)</text>
  <text x="40" y="128" class="s">VCXO 122.88, VCO 2949.12 MHz</text>
  <text x="40" y="146" class="s">OUT0 ÷384  SYSREF_FPGA 7.68 MHz</text>
  <text x="40" y="162" class="s">OUT1 ÷384  SYSREF_RFSOC 7.68 MHz</text>
  <text x="40" y="178" class="s">OUT2 ÷24   FPGA_REFCLK 122.88 MHz</text>
  <text x="40" y="194" class="s">OUT4 ÷24   → LMK00304 → LMX refs</text>
  <text x="40" y="210" class="s">SYNC via R11 SYNC_POL_INV toggle</text>

  <rect x="30" y="250" width="235" height="120" class="clk" rx="6"/>
  <text x="40" y="270" class="t">LMX2594 x3</text>
  <text x="40" y="288" class="s">U102 A/B → ADC 224 / 225</text>
  <text x="40" y="304" class="s">U103 A/B → ADC 227 / 226</text>
  <text x="40" y="320" class="s">U104 A   → DAC 228</text>
  <text x="40" y="338" class="s">VCO 7864.32 ÷32 = 245.76 MHz</text>
  <text x="40" y="356" class="s">(TICS Pro file, unchanged)</text>

  <rect x="30" y="400" width="235" height="95" class="clk" rx="6"/>
  <text x="40" y="420" class="t">SC18IS602B I2C→SPI</text>
  <text x="40" y="438" class="s">PS I2C1 → TCA9548A 0x74 ch5</text>
  <text x="40" y="454" class="s">addr 0x2F; SS0 U104, SS1 LMK,</text>
  <text x="40" y="470" class="s">SS2 U103, SS3 U102</text>
  <text x="40" y="486" class="s">programmed by lunaserver</text>
  <path d="M147,400 L147,375" class="ck"/>
  <path d="M100,400 C60,390 60,240 100,222" class="ck"/>
  <path d="M147,220 L147,248" class="ck"/>

  <!-- RFDC -->
  <rect x="310" y="90" width="210" height="330" class="rf" rx="6"/>
  <text x="320" y="110" class="t">RF Data Converter</text>
  <text x="320" y="128" class="s">4 dual ADC tiles 224..227</text>
  <text x="320" y="144" class="s">8 x ADC, 12 bit, real</text>
  <text x="320" y="160" class="s">fs 3932.16 MSPS, internal PLL</text>
  <text x="320" y="176" class="s">ref 245.76 MHz, no decimation</text>
  <text x="320" y="192" class="s">8 samples/clk @ 491.52 MHz</text>
  <text x="320" y="208" class="s">MTS on ADC tiles 0..3</text>
  <text x="320" y="230" class="s">DAC tile 228: enabled only to</text>
  <text x="320" y="246" class="s">host the Gen1 SYSREF receiver</text>
  <text x="320" y="262" class="s">(input tied to 0, no output)</text>
  <text x="320" y="290" class="s">ch0 224/I01 (RFMC_ADC_00)</text>
  <text x="320" y="306" class="s">ch1 224/I23 … ch7 227/I23</text>
  <text x="320" y="340" class="s">AXI-Lite 0xA000_0000</text>
  <text x="320" y="356" class="s">user_sysref_adc ← PL SYSREF</text>
  <path d="M265,310 L308,310" class="ck"/>
  <path d="M265,160 C285,160 285,240 308,240" class="ck"/>
  <text x="270" y="385" class="s" fill="#c77d1a">8 RF inputs</text>
  <path d="M275,395 L308,395" class="ln"/>

  <!-- MMCM + SYSREF -->
  <rect x="310" y="450" width="210" height="95" class="clk" rx="6"/>
  <text x="320" y="470" class="t">MMCM (clk_wiz)</text>
  <text x="320" y="488" class="s">122.88 (AL16/AL15) ×8 = 983.04</text>
  <text x="320" y="504" class="s">clk_2x 491.52 / clk_1x 245.76</text>
  <text x="320" y="520" class="s">clk_spec 122.88 (spectrometer)</text>
  <text x="320" y="536" class="s">reset/lock via AXI GPIO</text>
  <rect x="310" y="560" width="210" height="60" class="clk" rx="6"/>
  <text x="320" y="580" class="t">pl_sysref_sync</text>
  <text x="320" y="598" class="s">AK17/AK16, falling-edge capture</text>
  <text x="320" y="613" class="s">→ clk_2x → user_sysref_adc</text>
  <path d="M265,180 C290,180 285,480 308,480" class="ck"/>
  <path d="M265,146 C295,146 290,585 308,585" class="ck"/>

  <!-- trigger datapath -->
  <path d="M520,150 L565,150" class="bus"/>
  <text x="524" y="140" class="s">8×128b</text>
  <rect x="565" y="90" width="120" height="120" class="pl" rx="6"/>
  <text x="575" y="110" class="t">adc_gearbox</text>
  <text x="575" y="128" class="s">×8</text>
  <text x="575" y="146" class="s">491.52 → 245.76</text>
  <text x="575" y="162" class="s">8 → 16 samples</text>
  <text x="575" y="178" class="s">(256 b/ch/clk)</text>
  <path d="M685,150 L725,150" class="bus"/>

  <rect x="725" y="90" width="130" height="120" class="pl" rx="6"/>
  <text x="735" y="110" class="t">chan_detect ×8</text>
  <text x="735" y="128" class="s">|x| &gt; THRESH[ch]</text>
  <text x="735" y="146" class="s">per-lane hits +</text>
  <text x="735" y="162" class="s">samples-since-hit</text>
  <text x="735" y="178" class="s">peak / hit counters</text>
  <path d="M855,150 L895,150" class="bus"/>

  <rect x="895" y="90" width="235" height="120" class="pl" rx="6"/>
  <text x="905" y="110" class="t">trig_logic (sample exact)</text>
  <text x="905" y="128" class="s">COINC: ≥N of mask within W (64)</text>
  <text x="905" y="144" class="s">ANTI: exactly 1 channel in ±W</text>
  <text x="905" y="160" class="s">SOFT trigger</text>
  <text x="905" y="178" class="s">→ trigger position (64-bit</text>
  <text x="905" y="194" class="s">sample index), channel mask</text>
  <path d="M1012,210 L1012,250" class="ln"/>

  <rect x="610" y="250" width="520" height="150" class="pl" rx="6"/>
  <text x="620" y="270" class="t">capture_ctrl : 4 banks × 8 ch × 16384 samples (URAM, 1 MiB)</text>
  <text x="620" y="290" class="s">active bank written continuously as a ring buffer (all 8 channels, same address)</text>
  <text x="620" y="306" class="s">trigger at T → keep words [T/16 − L/32, T/16 + L/32) → trigger in the middle (L/2 + T mod 16)</text>
  <text x="620" y="322" class="s">L = CAP_LEN 4096..16384; bank frozen after post-trigger half, next bank becomes active</text>
  <text x="620" y="338" class="s">all banks full → trigger counted as lost; IRQ while ≥1 bank full</text>
  <text x="620" y="360" class="s">readout: 64-byte header + ch0[L] … ch7[L] as 128-bit AXI-Stream (tlast)</text>
  <text x="620" y="380" class="s">trig_regs_axil 0xA010_0000 : thresholds, mode, N, W, mask, length, status</text>
  <path d="M640,210 L640,248" class="bus"/>

  <rect x="610" y="430" width="200" height="80" class="pl" rx="6"/>
  <text x="620" y="450" class="t">AXI DMA (S2MM)</text>
  <text x="620" y="468" class="s">simple mode, 128 bit</text>
  <text x="620" y="484" class="s">regs 0xA011_0000</text>
  <text x="620" y="500" class="s">→ DDR 0x7000_0000</text>
  <path d="M700,400 L700,428" class="bus"/>

  <rect x="850" y="430" width="280" height="100" class="pl" rx="6"/>
  <text x="860" y="450" class="t">AXI SmartConnect (control)</text>
  <text x="860" y="468" class="s">HPM0 → RFDC, trigger regs, DMA, GPIO,</text>
  <text x="860" y="484" class="s">spectrometer (clocks 100 / 245.76 / 122.88)</text>
  <text x="860" y="502" class="s">interrupts pl_ps_irq0: [0] trigger,</text>
  <text x="860" y="518" class="s">[1] DMA, [2] RFDC, [3] spectrometer</text>

  <!-- spectrometer -->
  <path d="M672,90 L672,80 L1140,80 L1140,190 L1163,190" class="sbus"/>
  <text x="700" y="76" class="s" fill="#13807f">spec_words: all 8 channels × 16 samples (after the gearbox) + 64-bit sample counter</text>

  <rect x="1150" y="90" width="285" height="690" rx="8" fill="none" stroke="#13807f" stroke-width="1.5"/>
  <text x="1162" y="110" class="t" fill="#13807f">spectrometer_top</text>
  <text x="1162" y="128" class="s">regs + spectrum memory 0xA014_0000 (128 KiB)</text>
  <text x="1162" y="142" class="s">clk_spec 122.88 MHz (MMCM CLKOUT3)</text>

  <rect x="1165" y="150" width="255" height="80" class="sp" rx="6"/>
  <text x="1175" y="170" class="t">Input select</text>
  <text x="1175" y="188" class="s">INPUT reg: any 1 of the 8 ADCs (default 0)</text>
  <text x="1175" y="204" class="s">pipelined 8:1 mux @ 245.76 MHz</text>
  <text x="1175" y="220" class="s">(1 register / channel, 4:1, 2:1)</text>
  <path d="M1292,230 L1292,248" class="sbus"/>

  <rect x="1165" y="250" width="255" height="65" class="sp" rx="6"/>
  <text x="1175" y="270" class="t">Gearbox 2:1</text>
  <text x="1175" y="288" class="s">16 samples @ 245.76 MHz →</text>
  <text x="1175" y="304" class="s">32 samples @ 122.88 MHz</text>
  <path d="M1292,315 L1292,333" class="sbus"/>

  <rect x="1165" y="335" width="255" height="95" class="sp" rx="6"/>
  <text x="1175" y="355" class="t">pfb32x16t (CSIRO)</text>
  <text x="1175" y="373" class="s">coarse polyphase filter bank</text>
  <text x="1175" y="389" class="s">32 real samples/clk → 17 subbands</text>
  <text x="1175" y="405" class="s">122.88 MHz wide, centred k × 122.88</text>
  <text x="1175" y="421" class="s">(subbands 0 and 16 real)</text>
  <path d="M1292,430 L1292,448" class="sbus"/>

  <rect x="1165" y="450" width="255" height="80" class="sp" rx="6"/>
  <text x="1175" y="470" class="t">Subband select</text>
  <text x="1175" y="488" class="s">SUBBAND reg 0..16 (default 12</text>
  <text x="1175" y="504" class="s">= 1474.56 MHz ± 61.44 MHz)</text>
  <text x="1175" y="520" class="s">rnd_23_18: round re/im 23 → 18 bit</text>
  <path d="M1292,530 L1292,548" class="sbus"/>

  <rect x="1165" y="550" width="255" height="95" class="sp" rx="6"/>
  <text x="1175" y="570" class="t">dfb4096x1c (CSIRO)</text>
  <text x="1175" y="588" class="s">4096-channel filter bank, 30 kHz</text>
  <text x="1175" y="604" class="s">one spectrum per 33.33 µs</text>
  <text x="1175" y="620" class="s">|X|² accumulated over ACC_LEN + 1</text>
  <text x="1175" y="636" class="s">spectra (default 180000 = 6.000 s)</text>
  <path d="M1292,645 L1292,663" class="sbus"/>

  <rect x="1165" y="665" width="255" height="100" class="sp" rx="6"/>
  <text x="1175" y="685" class="t">Spectrum memory</text>
  <text x="1175" y="703" class="s">2 banks × 4096 × 64 bit (URAM)</text>
  <text x="1175" y="719" class="s">outputs within 6 spectra of a restart</text>
  <text x="1175" y="735" class="s">dropped; only complete spectra kept</text>
  <text x="1175" y="751" class="s">IRQ [3] (SPI 92) while a bank is full</text>

  <path d="M1110,530 L1110,715 L1163,715" class="ctl"/>
  <text x="935" y="575" class="s" fill="#7a4bb0">AXI-Lite (clk_spec):</text>
  <text x="935" y="591" class="s" fill="#7a4bb0">ENABLE, INPUT, SUBBAND,</text>
  <text x="935" y="607" class="s" fill="#7a4bb0">ACC_LEN, status;</text>
  <text x="935" y="623" class="s" fill="#7a4bb0">spectrum bank read ≈ 3 ms;</text>
  <text x="935" y="639" class="s" fill="#7a4bb0">any change restarts</text>
  <text x="935" y="655" class="s" fill="#7a4bb0">the integration</text>

  <!-- PS -->
  <rect x="310" y="870" width="210" height="160" class="ps" rx="6"/>
  <text x="320" y="890" class="t">Cortex-A53 ×4</text>
  <text x="320" y="908" class="s">PetaLinux 2023.2</text>
  <text x="320" y="924" class="s">UIO (generic-uio): trigger,</text>
  <text x="320" y="940" class="s">DMA, buffer, spectrometer</text>
  <text x="320" y="956" class="s">librfdc + libmetal</text>
  <text x="320" y="972" class="s">SD card boot (SW6 1110)</text>
  <text x="320" y="988" class="s">I2C1 → clock bridge</text>

  <rect x="560" y="870" width="250" height="160" class="ps" rx="6"/>
  <text x="570" y="890" class="t">DDR4 + S_AXI_HP0</text>
  <text x="570" y="908" class="s">16 MiB reserved-memory</text>
  <text x="570" y="924" class="s">(DMA target, UIO)</text>
  <path d="M700,510 L700,868" class="bus"/>

  <rect x="850" y="870" width="400" height="160" class="ps" rx="6"/>
  <text x="860" y="890" class="t">lunaserver (C)</text>
  <text x="860" y="908" class="s">1. program LMK04208 + 3×LMX2594 (i2c-dev)</text>
  <text x="860" y="924" class="s">2. MMCM reset/lock, RFDC start-up, MTS</text>
  <text x="860" y="940" class="s">3. trigger IRQ (UIO) → READOUT → DMA → copy → RELEASE bank</text>
  <text x="860" y="956" class="s">4. spectrometer IRQ → read spectrum bank → release</text>
  <text x="860" y="972" class="s">5. push events to TCP 5000, spectra to TCP 5002 clients</text>
  <text x="860" y="988" class="s">6. text commands on TCP 5001 (SET …, SPEC …)</text>
  <text x="860" y="1012" class="s">config: /mnt/sd/lunaserver.conf (incl. spectrometer)</text>
  <path d="M870,868 L870,532" class="ctl"/>
  <path d="M810,950 L848,950" class="ln"/>

  <rect x="1515" y="870" width="255" height="160" class="ps" rx="6"/>
  <text x="1525" y="890" class="t">GEM3 1 GbE (RGMII)</text>
  <text x="1525" y="908" class="s">eth0 192.168.2.10/24</text>
  <text x="1525" y="936" class="s">TCP 5000 events →</text>
  <text x="1525" y="952" class="s">TCP 5001 ← commands</text>
  <text x="1525" y="968" class="s">TCP 5002 spectra →</text>
  <path d="M1250,950 L1513,950" class="ln"/>
  <path d="M1642,868 L1642,762" class="ln" style="marker-start:url(#a)"/>

  <rect x="1470" y="580" width="315" height="180" class="box" rx="6"/>
  <text x="1480" y="600" class="t">Client PC (Python, uv)</text>
  <text x="1480" y="620" class="s">lunaclient: EventStream, SpectrumStream, Control</text>
  <text x="1480" y="638" class="s">luna-client status / set / watch / record (.npz)</text>
  <text x="1480" y="654" class="s">luna-spec status / set / watch / record / plot</text>
  <text x="1480" y="674" class="s">lunaGUI (PyQt6): control panel incl.</text>
  <text x="1480" y="690" class="s">spectrometer, live event plots, spectrum window</text>
  <text x="1480" y="710" class="s">lunaAnalyser (PyQt6): offline viewer for</text>
  <text x="1480" y="726" class="s">recorded event .npz files</text>
  <text x="1480" y="746" class="s">on_event() stub for user analysis</text>

  <!-- legend -->
  <rect x="1470" y="90" width="315" height="165" class="box" rx="6"/>
  <text x="1480" y="110" class="t">Legend</text>
  <path d="M1480,132 L1530,132" class="bus"/><text x="1540" y="136" class="s">trigger / capture sample data</text>
  <path d="M1480,156 L1530,156" class="sbus"/><text x="1540" y="160" class="s">spectrometer data</text>
  <path d="M1480,180 L1530,180" class="ck"/><text x="1540" y="184" class="s">clocks / SYSREF</text>
  <path d="M1480,204 L1530,204" class="ctl"/><text x="1540" y="208" class="s">AXI-Lite control</text>
  <path d="M1480,228 L1530,228" class="ln"/><text x="1540" y="232" class="s">RF input / software / network</text>
</svg>
