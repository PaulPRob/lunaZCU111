<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1130" viewBox="0 0 1800 1130"
     font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d17a00"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fa0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="abs" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <style>
      .title{font-size:24px;font-weight:bold;fill:#1a1a1a}
      .sub{font-size:14px;fill:#444}
      .reg{font-size:16px;font-weight:bold}
      .bt{font-size:14.5px;font-weight:bold;fill:#1a1a1a}
      .tx{font-size:12.5px;fill:#333}
      .lbl{font-size:12px;fill:#333;font-style:italic}
      .board{fill:#fafafa;stroke:#555;stroke-width:2}
      .soc{fill:#ffffff;stroke:#333;stroke-width:2}
      .plr{fill:#eef7ee;stroke:#2e7d32;stroke-width:1.6}
      .psr{fill:#f4effa;stroke:#6a3fa0;stroke-width:1.6}
      .pl{fill:#ffffff;stroke:#2e7d32;stroke-width:1.6}
      .ps{fill:#ffffff;stroke:#6a3fa0;stroke-width:1.6}
      .ck{fill:#fff4e5;stroke:#d17a00;stroke-width:1.6}
      .net{fill:#e8f1fb;stroke:#1565c0;stroke-width:1.6}
      .ext{fill:#ffffff;stroke:#1565c0;stroke-width:1.6}
      .data{stroke:#2e7d32;stroke-width:6;fill:none;marker-end:url(#ag)}
      .clk{stroke:#d17a00;stroke-width:2.2;fill:none;marker-end:url(#ao)}
      .ctl{stroke:#6a3fa0;stroke-width:2.2;fill:none;stroke-dasharray:7 4;marker-end:url(#ap)}
      .irq{stroke:#c62828;stroke-width:2.4;fill:none;stroke-dasharray:3 3;marker-end:url(#ar)}
      .eth{stroke:#1565c0;stroke-width:9;fill:none;marker-end:url(#ab);marker-start:url(#ab)}
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1130" fill="#ffffff"/>
  <text x="30" y="42" class="title">lunaZCU111 — 8-channel 3.93 GS/s transient trigger &amp; capture system</text>
  <text x="30" y="66" class="sub">Xilinx ZCU111 (XCZU28DR RFSoC) · every sample of 8 RF inputs tested in real time · triggered 8-channel snapshots streamed over Ethernet</text>

  <!-- ===================== status badge ===================== -->
  <rect x="1440" y="18" width="340" height="56" rx="10" fill="#e3f2e4" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="1471" cy="46" r="15" fill="#2e7d32"/>
  <path d="M1463,46 L1469,52 L1480,40" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1497" y="41" class="bt" fill="#1b5e20">Verified on hardware</text>
  <text x="1497" y="61" class="tx">October 2026 · capturing event data</text>

  <!-- ===================== RF inputs ===================== -->
  <rect x="20" y="205" width="105" height="120" rx="8" class="ext"/>
  <text x="72" y="240" class="bt" text-anchor="middle">8 × RF</text>
  <text x="72" y="260" class="bt" text-anchor="middle">inputs</text>
  <text x="72" y="284" class="tx" text-anchor="middle">RFMC J47</text>
  <text x="72" y="302" class="tx" text-anchor="middle">ADC_00…07</text>

  <!-- ===================== board ===================== -->
  <rect x="140" y="85" width="1265" height="985" rx="14" class="board"/>
  <text x="160" y="110" class="reg" fill="#444">ZCU111 evaluation board</text>

  <!-- clocking -->
  <rect x="160" y="385" width="300" height="220" rx="8" class="ck"/>
  <text x="175" y="410" class="bt">RF clock generation</text>
  <text x="175" y="434" class="tx">LMK04208 reference PLL</text>
  <text x="185" y="453" class="tx">• PL clock 122.88 MHz</text>
  <text x="185" y="471" class="tx">• SYSREF 7.68 MHz (PL + RFDC)</text>
  <text x="175" y="497" class="tx">3 × LMX2594 RF PLLs</text>
  <text x="185" y="516" class="tx">• 245.76 MHz ADC tile reference</text>
  <text x="175" y="542" class="tx">programmed by the PS through</text>
  <text x="175" y="560" class="tx">I2C → SC18IS602 I2C/SPI bridge</text>
  <text x="175" y="590" class="lbl">(TICS Pro register tables)</text>

  <!-- SD card -->
  <rect x="160" y="950" width="300" height="95" rx="8" class="ext"/>
  <text x="175" y="975" class="bt">SD card</text>
  <text x="175" y="997" class="tx">BOOT.BIN (FSBL, bitstream, U-Boot)</text>
  <text x="175" y="1015" class="tx">image.ub (Linux + root file system)</text>
  <text x="175" y="1033" class="tx">lunaserver.conf (saved settings)</text>

  <!-- ===================== RFSoC ===================== -->
  <rect x="490" y="120" width="895" height="935" rx="12" class="soc"/>
  <text x="505" y="145" class="reg">XCZU28DR Zynq UltraScale+ RFSoC</text>

  <!-- PL region -->
  <rect x="505" y="158" width="865" height="455" rx="10" class="plr"/>
  <text x="520" y="180" class="reg" fill="#2e7d32">Programmable Logic (PL) — VHDL + Xilinx IP</text>

  <rect x="520" y="200" width="180" height="135" rx="8" class="pl"/>
  <text x="532" y="222" class="bt">RF Data Converter</text>
  <text x="532" y="244" class="tx">8 × 12-bit ADC</text>
  <text x="532" y="262" class="tx">3932.16 MS/s each</text>
  <text x="532" y="280" class="tx">on-chip PLL (245.76 MHz)</text>
  <text x="532" y="298" class="tx">multi-tile sync (MTS)</text>
  <text x="532" y="316" class="tx">real, no decimation</text>

  <rect x="722" y="200" width="160" height="135" rx="8" class="pl"/>
  <text x="734" y="222" class="bt">Gearbox ×8</text>
  <text x="734" y="244" class="tx">8 samples @ 491.52</text>
  <text x="734" y="262" class="tx">→ 16 samples</text>
  <text x="734" y="280" class="tx">@ 245.76 MHz</text>
  <text x="734" y="302" class="tx">all channels aligned</text>

  <rect x="904" y="200" width="160" height="135" rx="8" class="pl"/>
  <text x="916" y="222" class="bt">Threshold ×8</text>
  <text x="916" y="244" class="tx">every sample:</text>
  <text x="916" y="262" class="tx">|x| &gt; T[channel]</text>
  <text x="916" y="284" class="tx">hit timing per</text>
  <text x="916" y="302" class="tx">sample, peak &amp; rate</text>

  <rect x="1086" y="200" width="270" height="135" rx="8" class="pl"/>
  <text x="1098" y="222" class="bt">Trigger logic (sample exact)</text>
  <text x="1098" y="244" class="tx">• Coincidence: ≥ N of the enabled</text>
  <text x="1110" y="262" class="tx">channels within W samples (64)</text>
  <text x="1098" y="282" class="tx">• Anti-coincidence: exactly one</text>
  <text x="1110" y="300" class="tx">channel within ±W samples</text>
  <text x="1098" y="320" class="tx">• Software trigger</text>

  <rect x="520" y="385" width="125" height="120" rx="8" class="pl"/>
  <text x="530" y="407" class="bt">Registers</text>
  <text x="530" y="428" class="tx">thresholds</text>
  <text x="530" y="446" class="tx">mode, N, W</text>
  <text x="530" y="464" class="tx">mask, length</text>
  <text x="530" y="482" class="tx">status, counters</text>

  <rect x="665" y="385" width="195" height="120" rx="8" class="pl"/>
  <text x="677" y="407" class="bt">Readout + AXI DMA</text>
  <text x="677" y="429" class="tx">event header +</text>
  <text x="677" y="447" class="tx">8 × L samples</text>
  <text x="677" y="469" class="tx">streamed to DDR</text>
  <text x="677" y="487" class="tx">(≈ 70 µs / event)</text>

  <rect x="890" y="385" width="466" height="120" rx="8" class="pl"/>
  <text x="902" y="407" class="bt">Capture buffers (UltraRAM, 1 MiB)</text>
  <text x="902" y="429" class="tx">4 banks × 8 channels × 16384 samples, continuously written ring buffer</text>
  <text x="902" y="449" class="tx">on trigger: keep L/2 samples before + L/2 after → trigger in the centre</text>
  <text x="902" y="469" class="tx">L = 16384 (programmable 4096 … 16384), all 8 channels simultaneously</text>
  <text x="902" y="489" class="tx">next bank armed immediately → new events while older ones are read</text>

  <rect x="520" y="540" width="250" height="55" rx="8" class="ck"/>
  <text x="532" y="562" class="bt">MMCM clocking</text>
  <text x="532" y="582" class="tx">491.52 / 245.76 MHz from 122.88</text>
  <rect x="790" y="540" width="215" height="55" rx="8" class="ck"/>
  <text x="802" y="562" class="bt">SYSREF capture</text>
  <text x="802" y="582" class="tx">aligns tiles for MTS</text>

  <!-- PS region -->
  <rect x="505" y="640" width="865" height="400" rx="10" class="psr"/>
  <text x="712" y="662" class="reg" fill="#6a3fa0">Processing System (PS) — ARM Cortex-A53 ×4, Linux</text>

  <rect x="520" y="680" width="180" height="110" rx="8" class="ps"/>
  <text x="532" y="702" class="bt">DDR4 memory</text>
  <text x="532" y="724" class="tx">16 MiB reserved</text>
  <text x="532" y="742" class="tx">DMA event buffer</text>

  <rect x="520" y="810" width="180" height="215" rx="8" class="ps"/>
  <text x="532" y="832" class="bt">Linux kernel</text>
  <text x="532" y="854" class="tx">UIO drivers:</text>
  <text x="542" y="872" class="tx">registers, IRQ,</text>
  <text x="542" y="890" class="tx">DMA, buffer</text>
  <text x="532" y="912" class="tx">libmetal / librfdc</text>
  <text x="532" y="932" class="tx">i2c-dev</text>
  <text x="532" y="952" class="tx">network stack</text>
  <text x="532" y="972" class="tx">systemd service</text>

  <rect x="722" y="680" width="468" height="345" rx="8" class="ps"/>
  <text x="736" y="703" class="bt">lunaserver (C) — capture &amp; network server</text>
  <rect x="736" y="717" width="215" height="90" rx="6" class="ps"/>
  <text x="746" y="738" class="bt" style="font-size:13px">Clock setup</text>
  <text x="746" y="758" class="tx">program LMK04208 +</text>
  <text x="746" y="776" class="tx">LMX2594 at start-up,</text>
  <text x="746" y="794" class="tx">reset MMCM, wait lock</text>
  <rect x="736" y="817" width="215" height="90" rx="6" class="ps"/>
  <text x="746" y="838" class="bt" style="font-size:13px">RF converter start-up</text>
  <text x="746" y="858" class="tx">tile PLL lock check,</text>
  <text x="746" y="876" class="tx">multi-tile sync,</text>
  <text x="746" y="894" class="tx">RESYNC on request</text>
  <rect x="736" y="917" width="215" height="95" rx="6" class="ps"/>
  <text x="746" y="938" class="bt" style="font-size:13px">Configuration</text>
  <text x="746" y="958" class="tx">apply to registers,</text>
  <text x="746" y="976" class="tx">load / SAVE to</text>
  <text x="746" y="994" class="tx">lunaserver.conf</text>

  <rect x="963" y="717" width="215" height="90" rx="6" class="ps"/>
  <text x="973" y="738" class="bt" style="font-size:13px">Event readout</text>
  <text x="973" y="758" class="tx">on trigger interrupt:</text>
  <text x="973" y="776" class="tx">DMA → copy → free bank</text>
  <text x="973" y="794" class="tx">(4 banks queue events)</text>
  <rect x="963" y="817" width="215" height="90" rx="6" class="ps"/>
  <text x="973" y="838" class="bt" style="font-size:13px">Data server  TCP 5000</text>
  <text x="973" y="858" class="tx">pushes every event to</text>
  <text x="973" y="876" class="tx">all clients; per-client</text>
  <text x="973" y="894" class="tx">queue, never blocks</text>
  <rect x="963" y="917" width="215" height="95" rx="6" class="ps"/>
  <text x="973" y="938" class="bt" style="font-size:13px">Control server TCP 5001</text>
  <text x="973" y="958" class="tx">text commands:</text>
  <text x="973" y="976" class="tx">SET THRESH / MODE / N /</text>
  <text x="973" y="994" class="tx">WINDOW / MASK / LEN …</text>

  <rect x="1210" y="740" width="148" height="230" rx="8" class="net"/>
  <text x="1284" y="770" class="bt" text-anchor="middle">GEM3</text>
  <text x="1284" y="792" class="tx" text-anchor="middle">Ethernet MAC</text>
  <text x="1284" y="812" class="tx" text-anchor="middle">1 Gb/s</text>
  <text x="1284" y="850" class="bt" text-anchor="middle" style="font-size:13px">192.168.2.10</text>
  <text x="1284" y="890" class="tx" text-anchor="middle">~400 events/s</text>
  <text x="1284" y="908" class="tx" text-anchor="middle">at 16384</text>
  <text x="1284" y="926" class="tx" text-anchor="middle">samples</text>

  <!-- ===================== client side ===================== -->
  <rect x="1440" y="150" width="340" height="235" rx="10" class="ext"/>
  <text x="1455" y="175" class="bt">Event frame (TCP 5000)</text>
  <rect x="1455" y="190" width="310" height="36" fill="#e8f1fb" stroke="#1565c0"/>
  <text x="1465" y="213" class="tx">frame header 64 B — time, thresholds</text>
  <rect x="1455" y="226" width="310" height="54" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="1465" y="248" class="tx">event header 64 B — sequence no.,</text>
  <text x="1465" y="266" class="tx">trigger sample, channel mask, offset</text>
  <rect x="1455" y="280" width="310" height="54" fill="#ffffff" stroke="#555"/>
  <text x="1465" y="302" class="tx">samples int16 [8 channels][L]</text>
  <text x="1465" y="320" class="tx">trigger at index ≈ L/2</text>
  <text x="1455" y="366" class="lbl">≈ 256 KiB per event at L = 16384</text>

  <rect x="1440" y="640" width="340" height="385" rx="10" class="ext"/>
  <text x="1455" y="667" class="bt">Client PC — Python lunaclient</text>
  <rect x="1455" y="685" width="310" height="92" rx="6" fill="#e8f1fb" stroke="#1565c0"/>
  <text x="1467" y="707" class="bt" style="font-size:13px">EventStream  ← port 5000</text>
  <text x="1467" y="729" class="tx">receives every event as a numpy</text>
  <text x="1467" y="747" class="tx">array (8 × L) + trigger metadata</text>
  <text x="1467" y="765" class="tx">record to .npz / on_event() hook</text>
  <rect x="1455" y="790" width="310" height="92" rx="6" fill="#f4effa" stroke="#6a3fa0"/>
  <text x="1467" y="812" class="bt" style="font-size:13px">Control  → port 5001</text>
  <text x="1467" y="834" class="tx">set thresholds, mode, N, window,</text>
  <text x="1467" y="852" class="tx">mask, length; ARM / SOFTTRIG;</text>
  <text x="1467" y="870" class="tx">read peaks / rates / status</text>
  <rect x="1455" y="895" width="310" height="115" rx="6" fill="#ffffff" stroke="#555"/>
  <text x="1467" y="917" class="bt" style="font-size:13px">User analysis / monitoring</text>
  <text x="1467" y="939" class="tx">both connections open at once:</text>
  <text x="1467" y="957" class="tx">thresholds can be adjusted while</text>
  <text x="1467" y="975" class="tx">events stream (e.g. rate servo)</text>
  <text x="1467" y="995" class="tx">luna-client CLI: status/set/record</text>

  <!-- ===================== connections ===================== -->
  <!-- RF data path -->
  <path d="M125,265 L516,265" class="data"/>
  <path d="M700,265 L718,265" class="data"/>
  <path d="M882,265 L900,265" class="data"/>
  <path d="M1064,265 L1082,265" class="data"/>
  <path d="M870,335 L870,375 Q870,382 877,382 L886,382" class="data" style="stroke-width:4"/>
  <text x="892" y="375" class="lbl">samples</text>
  <path d="M1220,335 L1220,381" class="data" style="stroke-width:4"/>
  <text x="1228" y="363" class="lbl">trigger (time, channels)</text>
  <path d="M890,445 L864,445" class="data"/>
  <path d="M685,505 L685,676" class="data"/>
  <text x="692" y="628" class="lbl">DMA</text>

  <!-- clocks -->
  <path d="M310,385 L310,360 L610,360 L610,339" class="clk"/>
  <text x="318" y="352" class="lbl">245.76 MHz ref + SYSREF</text>
  <path d="M460,567 L516,567" class="clk"/>
  <text x="463" y="560" class="lbl">122.88</text>

  <!-- control -->
  <path d="M520,915 L310,915 L310,610" class="ctl"/>
  <text x="320" y="890" class="lbl">I2C (clock programming)</text>
  <path d="M460,997 L516,997" class="ctl"/>
  <text x="462" y="990" class="lbl">boot</text>
  <path d="M780,678 L780,522 L585,522 L585,509" class="ctl"/>
  <text x="786" y="630" class="lbl">AXI-Lite (UIO)</text>
  <path d="M1290,505 L1290,560 L1198,560 L1198,760 L1182,760" class="irq"/>
  <text x="1040" y="578" class="lbl">interrupt: event ready</text>
  <path d="M700,735 L732,735" class="data" style="stroke-width:4"/>

  <!-- network -->
  <path d="M1178,862 L1206,862" class="ctl" style="stroke:#1565c0;marker-end:url(#abs);stroke-dasharray:none"/>
  <path d="M1206,962 L1178,962" class="ctl" style="stroke:#1565c0;marker-end:url(#abs);stroke-dasharray:none;marker-start:url(#abs)"/>
  <path d="M1368,855 L1432,855" class="eth"/>
  <text x="1400" y="835" class="bt" text-anchor="middle" style="font-size:12.5px">1 GbE</text>
  <path d="M1610,640 L1610,392" class="ctl" style="stroke:#1565c0;stroke-dasharray:4 4;marker-end:url(#abs)"/>

  <!-- ===================== legend ===================== -->
  <g transform="translate(140,1095)">
    <path d="M0,0 L45,0" class="data" style="stroke-width:5"/><text x="55" y="5" class="tx">sample / event data</text>
    <path d="M220,0 L265,0" class="clk"/><text x="275" y="5" class="tx">clocks</text>
    <path d="M360,0 L405,0" class="ctl"/><text x="415" y="5" class="tx">control / configuration</text>
    <path d="M600,0 L645,0" class="irq"/><text x="655" y="5" class="tx">interrupt</text>
    <path d="M760,0 L805,0" class="eth" style="stroke-width:6"/><text x="818" y="5" class="tx">Ethernet (TCP)</text>
    <rect x="960" y="-9" width="18" height="18" class="pl"/><text x="985" y="5" class="tx">PL (FPGA fabric)</text>
    <rect x="1130" y="-9" width="18" height="18" class="ps"/><text x="1155" y="5" class="tx">PS software</text>
  </g>
</svg>
