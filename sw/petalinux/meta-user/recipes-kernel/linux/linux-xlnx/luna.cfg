# user-space I/O for the PL blocks and the RFDC (libmetal)
# (listed in KERNEL_FEATURES so it is merged after meta-openamp openamp.cfg,
#  which would otherwise turn UIO_PDRV_GENIRQ into a module)
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
CONFIG_UIO_DMEM_GENIRQ=y
# clock programming through i2c-dev and the TCA9548A mux
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_MUX=y
CONFIG_I2C_MUX_PCA954x=y
